name: Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install plugin server dependencies
        run: |
          bun install --cwd plugin/mcp --frozen-lockfile
          bun install --cwd inspect/mcp --frozen-lockfile
      - name: Commitlint
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            from="$BASE_SHA"; to="$HEAD_SHA"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -qE '^0+$'; then
            from="$BEFORE_SHA"; to="$GITHUB_SHA"
          else
            # First push: lint from the commit that added lefthook.yml (gates apply from then).
            base="$(git log --diff-filter=A --format=%H -- lefthook.yml | tail -n 1)"
            if [ -n "$base" ] && git rev-parse -q --verify "$base^" >/dev/null; then
              from="$base^"
            else
              # No usable base: lint every commit, root included (a range would skip the root).
              for sha in $(git rev-list --reverse "$GITHUB_SHA"); do
                git log -1 --format=%B "$sha" | bunx commitlint || exit 1
              done
              exit 0
            fi
            to="$GITHUB_SHA"
          fi
          bunx commitlint --from "$from" --to "$to"
      - name: Typecheck
        run: bun run typecheck
      - name: Format
        run: bun run format:check
      - name: Lint code
        run: bun run lint:code
      - name: Lint markdown
        run: bun run lint
      - name: Docs check
        run: bun run check:docs
      - name: Schemas check
        run: bun run schemas:check
      - name: Build
        run: bun run build
      - name: Llms check
        run: bun run llms:check
      - name: Plugin check
        run: bun run plugin:check
      # Deploy only from main in this repo: never from forks, PRs, or other branches.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.repository == 'xsyetopz/claude-code-docs' && github.ref == 'refs/heads/main'
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'xsyetopz/claude-code-docs' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
